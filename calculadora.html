<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora GSA | Grana Sem Aperto</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-dark">

    <header class="cabecalho">
        <a href="index.html" class="logo">Grana Sem Aperto</a>
        <nav class="menu-desktop">
            <a href="index.html">Início</a>
            <a href="cursos.html">Cursos</a>
            <button class="menu-mobile-btn">☰</button>
        </nav>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo">GSA</span>
            <button class="fechar-sidebar" id="btnFechar">×</button>
        </div>
        <nav class="sidebar-links">
            <a href="index.html">Início</a>
            <a href="cursos.html">Cursos</a>
            <a href="calculadora.html">Calculadora de Juros</a> 
            <a href="#">Criadores</a>
        </nav>
        <div class="sidebar-feedback">
            <h4>Sugestões?</h4>
            <textarea id="feedbackText" placeholder="Manda sua ideia..."></textarea>
            <button class="btn-enviar-feedback">Enviar</button>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <section class="calc-container">
        <div class="calc-card revelar">
            <h2 class="destaque-verde">Calculadora de Juros Compostos</h2>
            <p style="color: var(--cinza-texto); margin-bottom: 20px;">Veja o poder do tempo sobre o seu dinheiro.</p>

            <div class="calc-inputs">
                <div class="input-group">
                    <label>Investimento Inicial (R$)</label>
                    <input type="number" id="valorInicial" placeholder="Ex: 1000">
                </div>
                <div class="input-group">
                    <label>Aporte Mensal (R$)</label>
                    <input type="number" id="valorMensal" placeholder="Ex: 200">
                </div>
                <div class="input-group">
                    <label>Taxa de Juros Anual (%)</label>
                    <input type="number" id="taxaAnual" placeholder="Ex: 12">
                </div>
                <div class="input-group">
                    <label>Tempo (Anos)</label>
                    <input type="number" id="tempoAnos" placeholder="Ex: 5">
                </div>
            </div>

            <button onclick="calcularGSA()" class="btn-primario btn-full">Calcular Futuro 🚀</button>

            <div id="resultadoGSA" class="resultado-box" style="display: none; margin-top: 30px; background: #09090b; padding: 20px; border-radius: 12px;">
                <div class="res-item" style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span style="color: var(--cinza-texto);">Total Investido</span>
                    <strong id="totalInvestido" style="color: #fff;">R$ 0,00</strong>
                </div>
                <div class="res-item" style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                    <span style="color: var(--cinza-texto);">Total em Juros</span>
                    <strong class="destaque-verde" id="totalJuros">R$ 0,00</strong>
                </div>
                <hr style="border: 1px solid #27272a; margin: 15px 0;">
                <div class="res-total" style="text-align: center;">
                    <span style="color: var(--cinza-texto);">Montante Final</span>
                    <h2 id="montanteFinal" style="color: var(--verde-gsa); font-size: 32px; margin-top: 10px;">R$ 0,00</h2>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
